[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhanes-diabetes"
version = "1.0.0"
description = "Survey-weighted NHANES analysis of undiagnosed diabetes gaps and model tradeoffs across demographic groups."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pyreadstat>=1.2,<2",
  "duckdb>=1.1,<2",
  "pyyaml>=6,<7",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6,<7",
  "types-openpyxl>=3.1,<4",
  "pillow>=10,<13",
  "formulas>=1.2,<2",
]

[project.scripts]
nhanes-diabetes = "nhanes_diabetes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "pyreadstat.*", "matplotlib.*", "pandas.*", "formulas.*"]
ignore_missing_imports = true
