name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --extra dev
      - run: make test
      - name: README, brief, Tableau extracts and workbook match the committed tables
        run: make check-readme

  full-pipeline:
    name: real data, R cross-check, artifact consistency
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("survey")'
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: nhanes-2017-raw-${{ hashFiles('data/data_manifest.json') }}
      - run: uv sync --extra dev
      - name: Download, verify hashes, analyze, cross-check against R, regenerate outputs
        run: uv run python -m nhanes_diabetes all
      - name: Committed outputs reproduce (informational)
        continue-on-error: true
        run: git diff --exit-code -- README.md outputs/tables/undiagnosis_estimates.csv outputs/tables/r_python_crosscheck.csv tableau/data
      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: |
            outputs/tables
            outputs/figures
            outputs/run_manifest.json
            dashboard/index.html
            excel/nhanes_diabetes_quality_review.xlsx
            reports/healthcare_quality_brief.md
            tableau/data
          retention-days: 30
